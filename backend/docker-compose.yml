version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: riiroow
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - 5432:5432

  api:
    build: ./backend
    working_dir: /app
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/riiroow
      JWT_SECRET: change_this_secret
      PORT: 4000
    ports:
      - 4000:4000
    depends_on:
      - db
    volumes:
      - ./backend:/app

volumes:
  db-data:
